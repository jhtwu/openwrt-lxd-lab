# Network Settings
BRIDGE_WAN="br-wan"
BRIDGE_LAN="br-lan"

# Container Names
CTR_ROUTER="ucosii-router"
LEGACY_CTR_ROUTER="openwrt-router"
CTR_WAN_HOST="wan-host"
CTR_LAN_HOST="lan-host"

# Router implementation
ROUTER_MODE="ucosii"
UCOSII_DIR="vendor/ucosii-aarch64"
QEMU_ROUTER_PID_FILE="run/ucosii-router.pid"
QEMU_LAN_TAP="qemu-lan"
QEMU_WAN_TAP="qemu-wan"
QEMU_ROUTER_MEMORY="2048M"
QEMU_ROUTER_CPU="cortex-a57"

# Images
OPENWRT_VERSION="24.10"
HOST_IMAGE="images:alpine/3.21"

# Host Interface Names (for readability in brctl/ip link)
HIF_OWRT_WAN="qemu-wan"
HIF_OWRT_LAN="qemu-lan"
HIF_WAN_HOST="v-wan-host"
HIF_LAN_HOST="v-lan-host"

# Container Internal Interface Names (for lxc list readability)
CIF_WAN="wan"
CIF_LAN="lan"

# Network IP (for verification)
WAN_NET="10.0.0.0/24"
WAN_IP_ROUTER="10.0.0.1"
WAN_IP_HOST="10.0.0.2"

LAN_NET="192.168.1.0/24"
LAN_IP_ROUTER="192.168.1.1"
LAN_IP_HOST="192.168.1.10"

# Throughput test (iperf3)
IPERF3_DURATION="5"
IPERF3_MIN_BPS="20000000" # 20 Mbit/s minimum in each direction for AArch64 QEMU TCG
